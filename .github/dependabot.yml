# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/frontend"
      - "/backend"
    schedule:
      interval: "weekly"
      day: "monday"
    
    open-pull-requests-limit: 5
    
    commit-message:
      prefix: "chore(deps)"
    
    # Önem/Risk sırasına göre gruplama
    groups:
      # 🟢 Düşük risk - Otomatik merge edilebilir
      patch-updates:
        update-types:
          - "patch"
      
      # 🟡 Orta risk - Review gerekir
      minor-updates:
        update-types:
          - "minor"
      
      # 🔴 Major güncellemeler GRUPLANMAZ! 
      # Her biri ayrı PR olarak gelir - dikkatli review
    
    # İstemediğiniz paketler (örnek)
    # ignore:
    #   - dependency-name: "example-package"
    #     update-types: ["version-update:semver-major"]
